name: Dane Sił Powietrznych

on:
  schedule:
    - cron: "10 6 * * *"    # 06:10 UTC = 09:10 Kijów; poranne podsumowanie wychodzi ok. 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz ostatnie 10 dni z t.me/s/kpszsu
        run: python scripts/scrape_af.py
      - name: Commit, jeśli coś się zmieniło
        run: |
          git config user.name "af-bot"
          git config user.email "af-bot@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "bez zmian"
          else
            git commit -m "dane SP: $(date -u +%F)"
            git push
          fi
